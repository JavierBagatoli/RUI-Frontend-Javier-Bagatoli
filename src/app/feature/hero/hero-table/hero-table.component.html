<table mat-table [dataSource]="dataSource()" class="mat-elevation-z8">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
  </ng-container>

  <ng-container matColumnDef="age">
    <th mat-header-cell *matHeaderCellDef>Edad</th>
    <td mat-cell *matCellDef="let element">{{ element.age }}</td>
  </ng-container>

  <ng-container matColumnDef="power">
    <th mat-header-cell *matHeaderCellDef>Poder</th>
    <td mat-cell *matCellDef="let element">{{ element.power }}</td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let element">
      <section class="flex-row gap-05">
        <button
          button
          matButton="outlined"
          (click)="openEditHero(element)"
          class="button-secondary"
        >
          Editar
        </button>
        <button
          matIconButton
          class="button-error no-Style-button"
          (click)="openDeleteHero(element)"
        >
          <mat-icon aria-hidden="false" aria-label="Restart filter" fontIcon="delete"></mat-icon>
        </button>
      </section>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
</table>
<mat-paginator
  [length]="totalSize()"
  [pageSizeOptions]="[5, 10, 20]"
  [pageIndex]="paginationControl().index"
  [pageSize]="paginationControl().size"
  showFirstLastButtons
  (page)="callNewPage($event)"
  aria-label="Select page of periodic elements"
>
</mat-paginator>
