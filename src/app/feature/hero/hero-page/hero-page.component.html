<div class="flex-col">
  <section class="flex-col gap">
    <div class="flex-row gap" [formGroup]="searchForm" style="height: auto">
      <mat-form-field style="width: 100%">
        <mat-label>Filtrar por nombre:</mat-label>
        <input matInput formControlName="name" [disabled]="dataTable().loading" />
      </mat-form-field>

      <div style="margin-top: 0.7rem" class="flex-row gap">
        <button
          style="background-color: white"
          matMiniFab
          (click)="callSearch()"
          [disabled]="!canSearch() || dataTable().loading"
        >
          <mat-icon aria-hidden="false" aria-label="Call filter" fontIcon="find_in_page"></mat-icon>
        </button>

        @if (isFilterSearch()) {
          <button
            style="background-color: white"
            matMiniFab
            (click)="restartFilter()"
            [disabled]="canSearch()"
          >
            <mat-icon
              aria-hidden="false"
              aria-label="Restart filter"
              fontIcon="find_replace"
            ></mat-icon>
          </button>
        }
      </div>
    </div>
    <div>
      <button
        style="display: flex; width: 100%"
        matButton="filled"
        (click)="openAddHero()"
        [disabled]="dataTable().loading"
      >
        Agregar Heroe
      </button>
    </div>
    <div class="overflow">
      @if (dataTable().loading) {
        <div class="flex-row w-100" style="justify-content: center; margin-top: 10rem">
          <mat-spinner></mat-spinner>
        </div>
      } @else if (dataTable().data!.vector.length === 0) {
        <h2>No hay datos</h2>
      } @else {
        <hero-table [data]="dataTable().data!" [paginationControl]="pagination()"></hero-table>
      }
    </div>
  </section>
</div>
