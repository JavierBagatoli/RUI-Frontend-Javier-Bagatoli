<div class="flex-col">
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  @if (dataTable().loading) {
    <div class="flex-col gap mt-3">
      @for (item of [0, 1, 2, 3, 4]; track item) {
        <div class="loader">
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </div>
      }
    </div>
  } @else {
    <section class="flex-col gap">
      <div class="flex-row gap" [formGroup]="searchForm" style="height: auto">
        <mat-form-field style="width: 100%">
          <mat-label>Filtrar por nombre:</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <div style="margin-top: 0.7rem" class="flex-row gap">
          <button
            style="background-color: white"
            matMiniFab
            (click)="callSearch()"
            [disabled]="!canSearch()"
          >
            <mat-icon
              aria-hidden="false"
              aria-label="Call filter"
              fontIcon="find_in_page"
            ></mat-icon>
          </button>

          @if (isFilterSearch()) {
            <button
              style="background-color: white"
              matMiniFab
              (click)="restartFilter()"
              [disabled]="canSearch()"
            >
              <mat-icon
                aria-hidden="false"
                aria-label="Restart filter"
                fontIcon="find_replace"
              ></mat-icon>
            </button>
          }
        </div>
      </div>
      <div>
        <button style="display: flex; width: 100%" matButton="filled" (click)="openAddHero()">
          Agregar Heroe
        </button>
      </div>

      <hero-table [data]="dataTable().data!" [paginationControl]="pagination()"></hero-table>
    </section>
  }
</div>
