<h2 mat-dialog-title>{{ isCreate() ? 'Crear nuevo Heroe' : `Editar ${data?.name}` }}</h2>
<mat-dialog-content>
  <div class="flex-col">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="animal" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Edad</mat-label>
      <input matInput [(ngModel)]="animal" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Edad</mat-label>
      <input matInput [(ngModel)]="animal" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Edad</mat-label>
      <input matInput [(ngModel)]="animal" />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()">Descartar</button>
  <button matButton [mat-dialog-close]="animal()" cdkFocusInitial>
    {{ isCreate() ? 'Crear' : 'Editar' }}
  </button>
</mat-dialog-actions>
