<h2 mat-dialog-title>
  {{ isCreate() ? 'Crear nuevo Héroe' : `Editar a ${nameHero().toUpperCase()}` }}
</h2>
<mat-dialog-content>
  <div class="flex-col" [formGroup]="heroForm">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput uppercase formControlName="name" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Edad</mat-label>
      <input matInput formControlName="age" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Poder</mat-label>
      <input matInput formControlName="power" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onNoClick()" cdkFocusInitial>Descartar</button>
  <button matButton (click)="onYesClick()" [disabled]="!hasBeenEdited() || !isValid()">
    {{ isCreate() ? 'Crear' : 'Editar' }}
  </button>
</mat-dialog-actions>
